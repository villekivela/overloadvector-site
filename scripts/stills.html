<!doctype html>
<meta charset="utf-8" />
<title>Phone stills</title>
<script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
</script>
<canvas></canvas>
<script type="module">
  import { createPhone, POSES } from "/src/phone/phone.js";

  // The home page's camera (`fill`), so a still has the live phone's perspective and the one
  // holding its place doesn't jump when the model arrives. A still is the middle of that picture,
  // with the phone taking `TALL` of the still's height (Home.astro sizes the holding one by both).
  const FILL = 0.74;
  const TALL = 0.9;
  const drawn = document.querySelector("canvas");
  const phone = createPhone(drawn, { fill: FILL });
  /** A PNG of a theme's phone in a pose, with the screenshot at `shot` on its screen. */
  window.still = async (pose, theme, width, height, shot) => {
    const [wide, high] = [width, height].map((side) => Math.round((side * TALL) / FILL));
    phone.setSize(wide, high);
    phone.setFinish(theme);
    phone.setPose(POSES[pose]);
    phone.setScreen(await phone.loadScreen(shot));
    phone.render();
    const still = Object.assign(document.createElement("canvas"), { width, height });
    still.getContext("2d").drawImage(drawn, (width - wide) / 2, (height - high) / 2);
    return still.toDataURL("image/png");
  };
</script>
