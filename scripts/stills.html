<!doctype html>
<meta charset="utf-8" />
<title>Phone stills</title>
<script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
</script>
<canvas></canvas>
<script type="module">
  import { createPhone, FILL, POSES } from "/src/phone/phone.js";

  // A still is the middle of the picture the home page's camera takes, so it has the live phone's
  // perspective and the one holding its place doesn't jump when the model arrives. The phone takes
  // `SHARE` of a still's height (Home.astro sizes the holding one by this and `FILL`).
  const SHARE = 0.9;
  const drawn = document.querySelector("canvas");
  const phone = createPhone(drawn);
  /** A PNG of a theme's phone in a pose, with the screenshot at `shot` on its screen. */
  window.still = async (pose, theme, width, height, shot) => {
    const [wide, high] = [width, height].map((side) => Math.round((side * SHARE) / FILL));
    phone.setSize(wide, high);
    phone.setFinish(theme);
    phone.setPose(POSES[pose]);
    phone.setScreen(await phone.loadScreen(shot));
    phone.render();
    const still = Object.assign(document.createElement("canvas"), { width, height });
    // On whole pixels, so nothing is resampled.
    still.getContext("2d").drawImage(drawn, Math.round((width - wide) / 2), Math.round((height - high) / 2));
    return still.toDataURL("image/png");
  };
</script>
